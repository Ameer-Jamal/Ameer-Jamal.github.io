<h2 class="major">REACH OUT</h2>
<form action="https://formspree.io/f/xnqypvyy" method="POST" id="contactForm">
  <div class="fields">
    <div class="field half">
      <label for="name">Name</label>
      <input type="text" name="name" id="name" />
    </div>
    <div class="field half">
      <label for="email">Email</label>
      <input type="email" name="email">
    </div>
    <div class="field">
      <label for="message">Message</label>
      <textarea name="message" id="message" rows="4"></textarea>
    </div>
  </div>
  <ul class="actions">
    <li><input type="button" onclick="submitAndResetForm()" value="Send Message" class="primary" /></li>
    <li><input type="reset" value="Reset" /></li>
  </ul>
  <ul class="icons">
    <h2 class="">Socials</h2>
    <li><a href="https://www.linkedin.com/in/ameer-jamal/" class="icon brands fa-linkedin "><span class="label">linkedin</span></a></li>
    <li><a href="https://github.com/Ameer-Jamal/" class="icon brands fa-github"><span class="label">GitHub</span></a></li>
    <li><a href="#CV" class="icon brands" style="font-weight:800 ;">cv<span class="label">CV</span></a></li>
  </ul>
</form>
