name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Weekly: rebuild Pages so carousel fallback JSON stays fresh without a code push
    - cron: '0 6 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Opt into Node 24 for JS-based actions until it is the default (GitHub deprecation notice).
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (GitHub highlights + scripts)
        run: npm test

      - name: Unit tests (Angular)
        run: npm run test:ci

      - name: Refresh GitHub highlights JSON
        env:
          # Optional: create repo secret GH_PAT with repo read scope for higher API limits.
          # If unset, GITHUB_TOKEN from this workflow is used (enough for public repos).
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: node scripts/refresh-github-highlights.mjs

      - name: Build
        run: npm run build

      - name: Resolve build output
        run: |
          if [ -d "dist/portfolio/browser" ]; then
            echo "PAGES_DIR=dist/portfolio/browser" >> "$GITHUB_ENV"
          else
            echo "PAGES_DIR=dist/portfolio" >> "$GITHUB_ENV"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PAGES_DIR }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
